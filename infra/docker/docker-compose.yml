name: brando-mvp

services:
  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: brando-web
    environment:
      PORT: "3000"
      SERVICE_NAME: web
      API_GATEWAY_URL: http://api-gateway:8080
    ports:
      - "3000:3000"
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - brando-net

  api-gateway:
    build:
      context: ../../services/api-gateway
      dockerfile: Dockerfile
    container_name: brando-api-gateway
    environment:
      PORT: "8080"
      SERVICE_NAME: api-gateway
      CATALOG_SERVICE_URL: http://catalog-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
    ports:
      - "8080:8080"
    depends_on:
      catalog-service:
        condition: service_started
      media-service:
        condition: service_started
    networks:
      - brando-net

  catalog-service:
    build:
      context: ../../services/catalog-service
      dockerfile: Dockerfile
    container_name: brando-catalog-service
    environment:
      PORT: "8081"
      SERVICE_NAME: catalog-service
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: brando
      DB_USER: brando
      DB_PASSWORD: brando_dev_local
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brando-net

  media-service:
    build:
      context: ../../services/media-service
      dockerfile: Dockerfile
    container_name: brando-media-service
    environment:
      PORT: "8082"
      SERVICE_NAME: media-service
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: brando
      DB_USER: brando
      DB_PASSWORD: brando_dev_local
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - brando-net

  postgres:
    image: postgres:16-alpine
    container_name: brando-postgres
    environment:
      POSTGRES_DB: brando
      POSTGRES_USER: brando
      POSTGRES_PASSWORD: brando_dev_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brando -d brando"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - brando-net

  redis:
    image: redis:7-alpine
    container_name: brando-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - brando-net

networks:
  brando-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
